name: ChatGPT integration CI

on:
  push:
    branches:
      - feature/chatgpt-komikku-integration
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: chatgpt-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug
